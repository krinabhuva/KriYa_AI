version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kriya_ai_db
    environment:
      POSTGRES_USER: kriya_user
      POSTGRES_PASSWORD: kriya_password
      POSTGRES_DB: kriya_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kriya_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: kriya_ai_backend
    environment:
      DATABASE_URL: postgresql://kriya_user:kriya_password@postgres:5432/kriya_ai
      DEBUG: "False"
      SECRET_KEY: your-production-secret-key-change-this
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  default:
    name: kriya_ai_network
